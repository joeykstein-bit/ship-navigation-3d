<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ship Navigation">
<link rel="manifest" href="manifest.webmanifest">
<title>Ship Navigation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;700&display=swap">
<style>
  /* Layout: the game canvas fills the window at 16:9; a thin brass-and-wood strip below carries the controls. */
  :root {
    --wood: #1d120b;
    --wood-deep: #120b07;
    --brass: #c9a25a;
    --parchment: #ead9b5;
    --muted: #a8916c;
    --display: "IM Fell English SC", Georgia, "Times New Roman", serif;
    --body: "Alegreya Sans", "Gill Sans", "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  [hidden] { display: none !important; }
  body {
    background: radial-gradient(ellipse at 50% 35%, var(--wood) 0%, var(--wood-deep) 75%);
    color: var(--parchment);
    font-family: var(--body);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .stage {
    flex: 1;
    min-height: 0;
    display: grid;
    place-items: center;
    padding-block: 12px 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .frame {
    position: relative;
    aspect-ratio: 16 / 9;
    width: min(100%, calc((100vh - 84px) * 16 / 9));
    max-width: 100%;
    border-radius: 6px;
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--brass) 55%, transparent), 0 18px 50px rgb(0 0 0 / 0.6);
    background: var(--wood-deep);
    overflow: hidden;
  }
  #unity-canvas { width: 100%; height: 100%; display: block; background: var(--wood-deep); }
  #unity-canvas:focus-visible { outline: 2px solid var(--brass); outline-offset: -2px; }
  .loading {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 14px;
    text-align: center;
  }
  .loading h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(26px, 4vw, 44px);
    letter-spacing: 0.04em;
    margin: 0;
    text-wrap: balance;
  }
  .bar { width: min(320px, 60vw); height: 6px; margin: 0 auto; border-radius: 3px; background: color-mix(in srgb, var(--brass) 20%, transparent); overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--brass); transition: width 0.2s; }
  .loading p { margin: 0; color: var(--muted); font-size: 15px; }
  .error { color: #f0a58f; max-width: 46ch; }
  .strip {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px 20px;
    padding-block: 10px 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    font-size: 15px;
    color: var(--muted);
  }
  .keys { display: flex; flex-wrap: wrap; gap: 6px 18px; }
  kbd {
    font-family: var(--body);
    font-weight: 700;
    color: var(--parchment);
    border: 1px solid color-mix(in srgb, var(--brass) 60%, transparent);
    border-radius: 4px;
    padding: 0 6px;
    margin-right: 4px;
  }
  button {
    font: 700 14px var(--body);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--wood-deep);
    background: var(--brass);
    border: 0;
    border-radius: 4px;
    padding: 7px 14px;
    cursor: pointer;
  }
  button:hover { background: var(--parchment); }

  /* Phones and tablets: the game fills the screen edge to edge and the keyboard strip goes away. */
  .touch .stage { padding: 0; }
  .touch .frame { width: 100%; height: 100%; aspect-ratio: auto; border-radius: 0; box-shadow: none; }
  .touch .strip { display: none; }
  .ready {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 16px;
    padding: 24px;
    text-align: center;
    background: color-mix(in srgb, var(--wood-deep) 82%, transparent);
  }
  .ready h1 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 6vw, 44px); margin: 0; }
  .ready .choices { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .ready button { font-size: 17px; padding: 12px 22px; }
  .ready button.plain { background: transparent; color: var(--parchment); box-shadow: inset 0 0 0 1px var(--brass); }
  .ready p { margin: 0; color: var(--muted); max-width: 40ch; font-size: 15px; }
  .rotate {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 5;
    place-content: center;
    gap: 10px;
    padding: 24px;
    text-align: center;
    background: var(--wood-deep);
    font-size: 18px;
  }
  .rotate strong { font-family: var(--display); font-weight: 400; font-size: 30px; }
  @media (orientation: portrait) { .touch .rotate { display: grid; } }
  button:focus-visible { outline: 2px solid var(--parchment); outline-offset: 2px; }
</style>
</head>
<body>
<main class="stage">
  <div class="frame">
    <canvas id="unity-canvas" tabindex="0" aria-label="Ship Navigation game"></canvas>
    <div class="loading" id="loading">
      <h1>Ship Navigation</h1>
      <div class="bar" aria-hidden="true"><span id="progress"></span></div>
      <p id="status">Loading the charts… about 19 MB</p>
    </div>
    <div class="ready" id="ready" hidden>
      <h1>Ready to sail</h1>
      <div class="choices">
        <button type="button" id="play-full">Play full screen</button>
        <button type="button" class="plain" id="play-here">Play here</button>
      </div>
      <p id="ready-note">Hold the arrow buttons to steer. Tap View to switch between the chart and the deck.</p>
    </div>
  </div>
</main>
<div class="rotate" aria-live="polite"><strong>Turn your phone sideways</strong><span>The voyage plays in landscape.</span></div>
<footer class="strip">
  <div class="keys">
    <span><kbd>←</kbd><kbd>→</kbd> or <kbd>A</kbd><kbd>D</kbd> steer</span>
    <span><kbd>Space</kbd> set sail</span>
    <span><kbd>C</kbd> chart or deck view</span>
  </div>
  <button type="button" id="fullscreen">Full screen</button>
</footer>

<script>
  const canvas = document.getElementById("unity-canvas");
  const loading = document.getElementById("loading");
  const progress = document.getElementById("progress");
  const status = document.getElementById("status");
  let game = null;

  const touchDevice = matchMedia("(pointer: coarse)").matches || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  const canFullscreen = Boolean(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  const homeScreenApp = matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches || navigator.standalone === true;
  if (touchDevice) document.documentElement.classList.add("touch");

  // Full screen for the whole page (the game fills it on phones), locked to landscape where the browser allows.
  async function enterFullscreen() {
    const root = document.documentElement;
    try {
      if (root.requestFullscreen) await root.requestFullscreen({ navigationUI: "hide" });
      else if (root.webkitRequestFullscreen) root.webkitRequestFullscreen();
      if (screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape").catch(() => {});
    } catch (error) {
      /* the browser refused; keep playing in the page */
    }
  }

  function showError(message) {
    loading.hidden = false;
    status.className = "error";
    status.textContent = message;
  }

  const script = document.createElement("script");
  script.src = "Build/ship.loader.js";
  script.onerror = () => showError("The game files couldn't be loaded. Reload the page to try again.");
  script.onload = () => {
    createUnityInstance(canvas, {
      dataUrl: "Build/ship.data.unityweb",
      frameworkUrl: "Build/ship.framework.js.unityweb",
      codeUrl: "Build/ship.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Ship Navigation",
      productName: "Ship Navigation",
      productVersion: "1.0",
      // Phones have very dense screens; capping the pixel ratio keeps the 3D sea smooth.
      devicePixelRatio: touchDevice ? Math.min(window.devicePixelRatio || 1, 1.5) : undefined,
      showBanner: (message, type) => { if (type === "error") showError(message); },
    }, (value) => {
      progress.style.width = Math.round(value * 100) + "%";
    }).then((instance) => {
      game = instance;
      loading.hidden = true;
      canvas.focus();
      if (touchDevice && !homeScreenApp) {
        const ready = document.getElementById("ready");
        const full = document.getElementById("play-full");
        if (!canFullscreen) {
          // iPhone browsers can't make a page full screen; a home-screen shortcut opens it as a full-screen app.
          full.hidden = true;
          document.getElementById("play-here").className = "";
          document.getElementById("ready-note").textContent =
            "Hold the arrow buttons to steer. For full screen, tap Share, then Add to Home Screen, and open the game from there.";
        }
        ready.hidden = false;
        full.addEventListener("click", () => { enterFullscreen(); ready.hidden = true; canvas.focus(); });
        document.getElementById("play-here").addEventListener("click", () => { ready.hidden = true; canvas.focus(); });
      }
    }).catch((message) => showError(String(message)));
  };
  document.body.appendChild(script);

  // Keyboard input goes to the game once its canvas has focus.
  canvas.addEventListener("pointerdown", () => canvas.focus());

  document.getElementById("fullscreen").addEventListener("click", () => {
    if (game) {
      try { game.SetFullscreen(1); } catch (error) { /* some app views have no fullscreen */ }
    }
    canvas.focus();
  });
</script>
</body>
</html>
